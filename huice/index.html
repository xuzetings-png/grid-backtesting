<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Gemini Grid Lab - 全时点量化审计版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #0a0f1e; color: #e0e0e0; font-size: 12px; }
        .main-wrapper { display: flex; height: 100vh; padding: 8px; box-sizing: border-box; gap: 8px; }
        
        /* 侧边栏 */
        .sidebar { width: 320px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; height: 100%; }
        .card { background: #161c2d; padding: 10px; border-radius: 6px; border: 1px solid #2d3343; }
        
        /* 参数配置 */
        .row { display: flex; gap: 5px; margin-bottom: 5px; }
        .input-item { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 9px; color: #848da3; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
        input, select { background: #0a0f1e; border: 1px solid #3d4455; color: #fff; padding: 3px; border-radius: 4px; font-size: 11px; }
        
        /* 🚀 行情参考区优化：四点对齐 */
        .market-ref-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 4px; 
            background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px; margin-bottom: 8px; 
            border: 1px solid #2d3343;
        }
        .ref-box { display: flex; flex-direction: column; }
        .ref-label { font-size: 8px; color: #848da3; text-transform: uppercase; }
        .ref-val { font-family: monospace; font-size: 11px; font-weight: bold; color: #fff; }

        .btn-fetch { background: #23312c; color: #52c41a; border: 1px solid #52c41a; padding: 6px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 8px; }
        .btn-run { background: #1890ff; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 13px; }

        /* 审计卡片 */
        #audit-data-center { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .strategy-card { background: #1c243a; border-radius: 6px; border-left: 4px solid #ccc; padding: 8px; }
        .card-long { border-left-color: #52c41a; }
        .card-short { border-left-color: #ff4d4f; }
        .card-neutral { border-left-color: #faad14; }
        .card-hold { border-left-color: #1890ff; background: rgba(24, 144, 255, 0.05); }

        .strat-name { font-weight: bold; font-size: 11px; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .strat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
        .stat-line { display: flex; justify-content: space-between; font-family: monospace; font-size: 10px; border-bottom: 1px solid rgba(255,255,255,0.03); padding: 1px 0; }
        .stat-label { color: #848da3; }
        
        .chart-view { flex-grow: 1; background: #161c2d; border-radius: 6px; border: 1px solid #2d3343; padding: 12px; display: flex; flex-direction: column; }
        .chart-container { flex-grow: 1; position: relative; }
        
        .up { color: #52c41a !important; }
        .down { color: #ff4d4f !important; }
        .warn { color: #faad14 !important; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="sidebar">
        <div class="card">
            <div class="row">
                <div class="input-item" style="flex:2"><label>币对</label><input id="symbol" type="text" value="BTCUSDC"></div>
                <div class="input-item"><label>粒度</label><select id="interval"><option value="15m">15m</option><option value="1h" selected>1h</option></select></div>
            </div>
            <div class="row">
                <div class="input-item"><label>开始日期</label><input id="start" type="date"></div>
                <div class="input-item"><label>结束日期</label><input id="end" type="date"></div>
            </div>
            
            <button class="btn-fetch" onclick="fetchMarket()">📡 获取真实行情</button>
            
            <div class="market-ref-grid">
                <div class="ref-box"><span class="ref-label">起点价格 (Start)</span><span id="p-start" class="ref-val">-</span></div>
                <div class="ref-box"><span class="ref-label">终点价格 (End)</span><span id="p-last" class="ref-val">-</span></div>
                <div class="ref-box"><span class="ref-label">区间最高 (Max)</span><span id="p-max" class="ref-val up">-</span></div>
                <div class="ref-box"><span class="ref-label">区间最低 (Min)</span><span id="p-min" class="ref-val down">-</span></div>
            </div>

            <div class="row">
                <div class="input-item"><label>网格下限</label><input id="lower" type="number"></div>
                <div class="input-item"><label>网格上限</label><input id="upper" type="number"></div>
            </div>
            <div class="row">
                <div class="input-item"><label>格数</label><input id="grids" type="number" value="100"></div>
                <div class="input-item"><label>费率(万)</label><input id="fee" type="number" value="2"></div>
            </div>
            <button class="btn-run" id="run-btn" onclick="runBacktest()" disabled>🚀 启动全量深度审计</button>
        </div>

        <div id="audit-data-center">
            <div style="text-align:center; padding-top:40px; color:#444;">等待报告生成...</div>
        </div>
    </div>

    <div class="chart-view">
        <div class="chart-container"><canvas id="mainChart"></canvas></div>
    </div>
</div>

<script>
let chart; let globalKlines = [];
const d = new Date(); document.getElementById('end').value = d.toISOString().split('T')[0];
d.setDate(d.getDate() - 21); document.getElementById('start').value = d.toISOString().split('T')[0];

async function fetchMarket() {
    const symbol = document.getElementById('symbol').value.toUpperCase();
    const interval = document.getElementById('interval').value;
    const sTime = new Date(document.getElementById('start').value).getTime();
    const eTime = new Date(document.getElementById('end').value).setHours(23,59,59,999);
    try {
        let all = []; let cur = sTime;
        while (cur < eTime) {
            const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&startTime=${cur}&limit=1000`;
            const res = await fetch(url); const data = await res.json();
            if (!data.length) break;
            all = all.concat(data); cur = data[data.length - 1][0] + 1;
        }
        globalKlines = all.filter(d => d[0] >= sTime && d[0] <= eTime);
        
        // 🚀 获取四个关键点位
        const startP = parseFloat(globalKlines[0][4]);
        const lastP = parseFloat(globalKlines[globalKlines.length - 1][4]);
        const highs = globalKlines.map(k => parseFloat(k[2])), lows = globalKlines.map(k => parseFloat(k[3]));
        const maxP = Math.max(...highs), minP = Math.min(...lows);

        document.getElementById('p-start').innerText = startP.toFixed(2);
        document.getElementById('p-last').innerText = lastP.toFixed(2);
        document.getElementById('p-max').innerText = maxP.toFixed(2);
        document.getElementById('p-min').innerText = minP.toFixed(2);

        document.getElementById('lower').value = minP.toFixed(2);
        document.getElementById('upper').value = maxP.toFixed(2);
        document.getElementById('run-btn').disabled = false;
    } catch (e) { alert("获取失败"); }
}

function runBacktest() {
    const lower = parseFloat(document.getElementById('lower').value);
    const upper = parseFloat(document.getElementById('upper').value);
    const grids = parseInt(document.getElementById('grids').value);
    const feeRate = parseFloat(document.getElementById('fee').value) / 10000;
    const inv = 1000;
    const startP = parseFloat(globalKlines[0][4]);
    const diff = (upper - lower) / (grids - 1);
    const perUSD = inv / grids;
    const gridPrices = Array.from({length: grids}, (_, i) => lower + diff * i);

    const L = coreCalc("long", gridPrices, startP, perUSD, feeRate, inv, diff);
    const S = coreCalc("short", gridPrices, startP, perUSD, feeRate, inv, diff);
    const N = coreCalc("neutral", gridPrices, startP, perUSD, feeRate, inv, diff);
    const holdRaw = globalKlines.map(k => (inv / startP) * parseFloat(k[4]));

    const norm = (arr) => arr.map(v => (v / arr[0]) * inv);
    const lF = norm(L.history), sF = norm(S.history), nF = norm(N.history), hF = norm(holdRaw);

    renderChart(lF, sF, nF, hF);
    
    const getROI = (arr) => (((arr[arr.length-1]/inv)-1)*100).toFixed(2);
    const holdROI = getROI(hF);

    const buildCard = (name, cls, data, matches, arb, fees, final) => {
        const roi = getROI(final);
        const alpha = (roi - holdROI).toFixed(2);
        return `
            <div class="strategy-card ${cls}">
                <div class="strat-name"><span>${name}</span> <span class="${roi>=0?'up':'down'}">${roi}%</span></div>
                <div class="strat-grid">
                    <div class="stat-line"><span class="stat-label">成交次数</span><span class="stat-val">${matches}</span></div>
                    <div class="stat-line"><span class="stat-label">手续费</span><span class="stat-val down">-${fees.toFixed(2)}</span></div>
                    <div class="stat-line"><span class="stat-label">套利净利</span><span class="stat-val up">+${arb.toFixed(2)}</span></div>
                    <div class="stat-line"><span class="stat-label">Alpha</span><span class="stat-val warn">${alpha}%</span></div>
                </div>
            </div>`;
    };

    document.getElementById('audit-data-center').innerHTML = `
        ${buildCard("做多网格 (Long)", "card-long", L, L.matches, L.arb, L.fees, lF)}
        ${buildCard("做空网格 (Short)", "card-short", S, S.matches, S.arb, S.fees, sF)}
        ${buildCard("中性网格 (Neutral)", "card-neutral", N, N.matches, N.arb, N.fees, nF)}
        <div class="strategy-card card-hold">
            <div class="strat-name"><span>全仓持有 (Benchmark)</span> <span class="${holdROI>=0?'up':'down'}">${holdROI}%</span></div>
            <div class="strat-grid">
                <div class="stat-line"><span class="stat-label">终点价值</span><span class="stat-val">${hF[hF.length-1].toFixed(2)} USD</span></div>
                <div class="stat-line"><span class="stat-label">基准策略</span><span class="stat-val">Buy & Hold</span></div>
            </div>
        </div>
    `;
}

function coreCalc(type, prices, startP, perUSD, feeRate, inv, diff) {
    let usd = inv, btc = 0, status = new Array(prices.length).fill(true), history = [];
    let matches = 0, arb = 0, fees = 0;

    prices.forEach((p, i) => {
        if (type === "long" && p >= startP) { 
            let buyBTC = perUSD/p; let cost = perUSD * feeRate;
            btc += buyBTC; usd -= (perUSD + cost); fees += cost; status[i] = false; 
        }
        else if (type === "short" && p <= startP) { 
            let cost = perUSD * feeRate;
            btc -= perUSD/p; usd += (perUSD - cost); fees += cost; status[i] = false; 
        }
    });

    globalKlines.forEach(k => {
        const h = parseFloat(k[2]), l = parseFloat(k[3]), c = parseFloat(k[4]);
        prices.forEach((p, i) => {
            if (l <= p && status[i] && usd >= perUSD*(1+feeRate)) {
                if(!(type === "neutral" && p > startP)) { 
                    let cost = perUSD * feeRate;
                    btc += perUSD/p; usd -= (perUSD + cost); fees += cost; status[i] = false; 
                }
            }
            if (h >= (p + diff) && !status[i]) {
                if(!(type === "neutral" && (p+diff) < startP)) { 
                    let sellUSD = perUSD*((p+diff)/p); let cost = sellUSD * feeRate;
                    usd += (sellUSD - cost); btc -= perUSD/p; 
                    fees += cost; matches++; arb += (sellUSD - perUSD - cost); status[i] = true; 
                }
            }
        });
        history.push(usd + btc * c);
    });
    return { history, matches, arb, fees };
}

function renderChart(l, s, n, h) {
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('mainChart').getContext('2d'), {
        type: 'line',
        data: {
            labels: globalKlines.map(k => new Date(k[0]).toLocaleDateString()),
            datasets: [
                { label: 'Long', data: l, borderColor: '#52c41a', borderWidth: 2, pointRadius: 0, tension: 0.1 },
                { label: 'Short', data: s, borderColor: '#ff4d4f', borderWidth: 2, pointRadius: 0, tension: 0.1 },
                { label: 'Neutral', data: n, borderColor: '#faad14', borderWidth: 2, pointRadius: 0, tension: 0.1 },
                { label: 'Benchmark', data: h, borderColor: '#1890ff', borderDash: [5, 5], borderWidth: 1, pointRadius: 0, tension: 0.1 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            scales: { x: { ticks: { color: '#666', maxTicksLimit: 10 } }, y: { ticks: { color: '#666' }, grace: '5%' } },
            plugins: { legend: { labels: { color: '#ccc', font: { size: 10 } } } }
        }
    });
}
</script>
</body>
</html>
