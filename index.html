<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Gemini Grid Lab - 全视图审计终端 v6.2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>
    <style>
        :root {
            --bg-deep: #080a0f; --panel-bg: rgba(22, 27, 34, 0.8); --border: rgba(255, 255, 255, 0.08);
            --red: #f5222d; --green: #389e0d; --gold: #d48806; --blue: #1677ff; 
            --cyan: #00f2ff; --purple: #722ed1; --orange: #fa8c16;
            --text: #c9d1d9; --text-dim: #8b949e;
        }
        body { height: 100vh; margin: 0; overflow: hidden; font-family: 'JetBrains Mono', sans-serif; background: var(--bg-deep); color: var(--text); font-size: 11px; }
        .main-wrapper { display: flex; height: 100vh; padding: 6px; box-sizing: border-box; gap: 6px; }
        .sidebar { width: 340px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; height: 100%; }
        .config-card { background: var(--panel-bg); padding: 8px; border-radius: 4px; border: 1px solid var(--border); flex-shrink: 0; }
        .section-title { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; border-bottom: 1px solid var(--border); padding-bottom: 2px; font-weight: bold; text-transform: uppercase; }
        .row { display: flex; gap: 4px; margin-bottom: 3px; }
        .input-item { display: flex; flex-direction: column; flex: 1; }
        label { font-size: 9px; color: var(--text-dim); margin-bottom: 1px; transform: scale(0.9); transform-origin: left; }
        input, select { background: #000; border: 1px solid var(--border); color: #fff; padding: 0 6px; border-radius: 2px; font-size: 11px; height: 20px; }
        input:focus { border-color: var(--red); outline: none; }
        input[readonly] { background: transparent; border: none; color: #58a6ff; font-weight: bold; }
        .btn-fetch { background: #1c1c1c; color: var(--red); border: 1px solid #442222; padding: 2px; border-radius: 3px; cursor: pointer; width: 100%; font-size: 9px; margin: 2px 0; }
        .btn-run { background: var(--red); color: white; border: none; padding: 5px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 11px; }
        #audit-data-center { flex: 1; display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow-y: auto; }
        .log-row { flex: 1; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; display: flex; flex-direction: column; justify-content: space-around; min-height: 60px; }
        .log-header { display: flex; justify-content:space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .log-title { font-weight: bold; font-size: 10px; }
        .final-ret { font-size: 12px; font-weight: 800; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 2px; margin: 2px 0; }
        .stat-label { color: var(--text-dim); font-size: 8px; transform: scale(0.85); transform-origin: left; }
        .alpha-highlight { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 3px; padding: 2px 6px; display: flex; justify-content: space-between; align-items: center; }
        .chart-view { flex-grow: 1; background: var(--panel-bg); border-radius: 6px; border: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; }
        .up { color: var(--red) !important; } .down { color: var(--green) !important; }
        #mainChart { flex-grow: 1; width: 100% !important; height: 100% !important; min-height: 0; }
        
        /* 滚动条样式 */
        #audit-data-center::-webkit-scrollbar { width: 4px; }
        #audit-data-center::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    </style>
</head>
<body>
<div class="main-wrapper">
    <div class="sidebar">
        <div class="config-card">
            <div class="section-title">Terminal Access 行情接入</div>
            <div class="row">
                <div class="input-item"><label>交易对</label><input id="symbol" value="ETHUSDT"></div>
                <div class="input-item">
                    <label>周期</label>
                    <select id="interval">
                        <option value="1m">1min</option><option value="5m" selected>5min</option><option value="15m">15min</option>
                        <option value="30m">30min</option><option value="1h">1h</option><option value="4h">4h</option>
                        <option value="1d">1d</option><option value="3d">3d</option>
                    </select>
                </div>
            </div>
            <div class="row"><div class="input-item"><label>审计时间跨度</label><input id="dateRange"></div></div>
            <button class="btn-fetch" onclick="fetchMarket()">📡 FETCH HISTORICAL DATA</button>
            
            <div class="section-title">Strategy Configuration</div>
            <div class="row">
                <div class="input-item"><label>起点价 (Start)</label><input id="priceStart" readonly></div>
                <div class="input-item"><label>终点价 (End)</label><input id="priceEnd" readonly></div>
            </div>
            <div class="row">
                <div class="input-item"><label>最高 (High)</label><input id="refMax" readonly></div>
                <div class="input-item"><label>最低 (Low)</label><input id="refMin" readonly></div>
            </div>
            <div class="row">
                <div class="input-item"><label>网格上限</label><input id="gridUpper" type="number" step="any"></div>
                <div class="input-item"><label>网格下限</label><input id="gridLower" type="number" step="any"></div>
            </div>
            <div class="row">
                <div class="input-item"><label>格数</label><input id="grids" type="number" value="50"></div>
                <div class="input-item"><label>模式</label><select id="gridMode"><option value="arithmetic">等差</option><option value="geometric">等比</option></select></div>
            </div>
            <div class="row">
                <div class="input-item"><label>费率(%)</label><input id="fee" type="number" value="0.001" step="0.001"></div>
                <div class="input-item"><label>本金(USD)</label><input id="capital" type="number" value="1000"></div>
            </div>
            <button class="btn-run" id="run-btn" onclick="runBacktest()" disabled>🚀 EXECUTE DEEP AUDIT (6 STRATS)</button>
        </div>
        <div id="audit-data-center"></div>
    </div>
    <div class="chart-view">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <span style="color:var(--red); font-weight:800; letter-spacing:1px; font-size:12px;">QUANT AUDIT - NET VALUE</span>
            <span id="data-info" style="font-size:9px; color:var(--text-dim); border:1px solid var(--border); padding:2px 6px; border-radius:10px;">READY</span>
        </div>
        <canvas id="mainChart"></canvas>
    </div>
</div>

<script>
let chart; let globalKlines = []; let fp;
window.onload = () => { 
    const end = new Date();
    const start = new Date();
    start.setDate(start.getDate() - 3);
    fp = flatpickr("#dateRange", { mode: "range", locale: "zh", dateFormat: "Y-m-d", defaultDate: [start, end], theme: "dark" }); 
};

async function fetchMarket() {
    const symbol = document.getElementById('symbol').value.toUpperCase();
    const dates = fp.selectedDates; if(dates.length < 2) return alert("请选择时间范围");
    
    let sTime = dates[0].getTime(); 
    const eTime = dates[1].setHours(23,59,59,999);
    
    globalKlines = []; 
    const statusInfo = document.getElementById('data-info');
    statusInfo.innerText = "SYNCING...";
    
    try {
        while (true) {
            const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${document.getElementById('interval').value}&startTime=${sTime}&endTime=${eTime}&limit=1000`);
            const data = await res.json(); 
            if (!data || data.length === 0) break;
            
            globalKlines = globalKlines.concat(data); 
            if (data.length < 1000) break;
            
            sTime = data[data.length - 1][0] + 1;
            statusInfo.innerText = `SYNCING... (${globalKlines.length} BARS)`;
        }
        
        if(globalKlines.length === 0) throw new Error("No data");

        const startPrice = parseFloat(globalKlines[0][4]), endPrice = parseFloat(globalKlines[globalKlines.length - 1][4]);
        const high = Math.max(...globalKlines.map(k=>parseFloat(k[2]))), low = Math.min(...globalKlines.map(k=>parseFloat(k[3])));
        
        document.getElementById('priceStart').value = startPrice.toFixed(2);
        document.getElementById('priceEnd').value = endPrice.toFixed(2);
        document.getElementById('refMax').value = high.toFixed(2); 
        document.getElementById('refMin').value = low.toFixed(2);
        document.getElementById('gridUpper').value = high.toFixed(2); 
        document.getElementById('gridLower').value = low.toFixed(2);
        
        document.getElementById('run-btn').disabled = false;
        statusInfo.innerText = `${symbol} | ${globalKlines.length} K 线 | 振幅：${((high-low)/low*100).toFixed(2)}%`;
    } catch(e) { 
        console.error(e);
        statusInfo.innerText = "ERROR"; 
        alert("FETCH FAILED: " + e.message); 
    }
}

/**
 * 核心计算引擎
 */
function coreCalc(type, mode, gridPrices, startPrice, feeRate, initCapital, gridDiffs) {
    let usd = initCapital, pos = 0, trades = 0, feeUsd = 0, arbUsd = 0, history = [], prev = startPrice;
    const gridCount = gridPrices.length;
    const perUsd = initCapital / gridCount; 
    
    let lActive = new Array(gridCount).fill(true);
    let sActive = new Array(gridCount).fill(true);

    // --- 初始建仓逻辑：按市价建仓，确保起点净值=1000 ---
    if (mode === 'position') {
        let startIndex = 0;
        for(let i=0; i<gridCount-1; i++) {
            if (startPrice >= gridPrices[i] && startPrice <= gridPrices[i+1]) {
                startIndex = i;
                break;
            }
        }
        if (startPrice < gridPrices[0]) startIndex = -1; 
        if (startPrice > gridPrices[gridCount-1]) startIndex = gridCount - 1;

        if (type === 'long') {
            let targetGridCount = startIndex + 1;
            if (targetGridCount < 0) targetGridCount = 0;
            if (targetGridCount > gridCount) targetGridCount = gridCount;

            const investUsd = targetGridCount * perUsd;
            if (investUsd > 0) {
                pos = investUsd / startPrice;
                usd = initCapital - investUsd;
                const openFee = investUsd * feeRate;
                usd -= openFee; 
                feeUsd += openFee;
            }
            for (let i = 0; i <= startIndex; i++) lActive[i] = false;

        } else if (type === 'short') {
            let targetGridCount = gridCount - 1 - startIndex;
            if (targetGridCount < 0) targetGridCount = 0;
            
            const investUsd = targetGridCount * perUsd;
            if (investUsd > 0) {
                pos = -(investUsd / startPrice); 
                usd = initCapital + investUsd; 
                const openFee = investUsd * feeRate;
                usd -= openFee;
                feeUsd += openFee;
            }
            for (let i = startIndex + 1; i < gridCount; i++) sActive[i] = false;
        }
    }

    // --- 逐 K 线回测 ---
    globalKlines.forEach(k => {
        const [t, o, h, l, c] = k.map(Number);
        
        const exec = (i) => {
            const p = gridPrices[i], d = gridDiffs[i];
            
            if (type === 'long') {
                if (lActive[i] && l <= p && prev > p) {
                    const cost = perUsd; 
                    const fee = cost * feeRate;
                    if (usd >= cost + fee) {
                        usd -= (cost + fee); pos += (cost / p); feeUsd += fee; lActive[i] = false;
                    }
                }
                else if (!lActive[i] && h >= (p + d) && prev < (p + d)) {
                    const sellAmt = perUsd / p; 
                    const income = sellAmt * (p + d);
                    const fee = income * feeRate;
                    usd += (income - fee); pos -= sellAmt; feeUsd += fee; 
                    arbUsd += (income - fee - perUsd); 
                    trades++; lActive[i] = true;
                }
            }
            
            if (type === 'short') {
                if (sActive[i] && h >= p && prev < p) {
                    const val = perUsd;
                    const fee = val * feeRate;
                    usd += (val - fee); pos -= (val / p); feeUsd += fee; sActive[i] = false;
                }
                else if (!sActive[i] && l <= (p - d) && prev > (p - d)) {
                    const buyAmt = perUsd / p;
                    const cost = buyAmt * (p - d);
                    const fee = cost * feeRate;
                    usd -= (cost + fee); pos += buyAmt; feeUsd += fee;
                    arbUsd += (perUsd - cost - fee);
                    trades++; sActive[i] = true;
                }
            }

            if (type === 'neutral') {
                if (p < startPrice) {
                    if (lActive[i] && l <= p && prev > p) {
                        const cost = perUsd; 
                        const fee = cost * feeRate;
                        if (usd >= cost + fee) {
                            usd -= (cost + fee); pos += (cost / p); feeUsd += fee; lActive[i] = false;
                        }
                    }
                    else if (!lActive[i] && h >= (p + d) && prev < (p + d)) {
                        const sellAmt = perUsd / p;
                        const income = sellAmt * (p + d);
                        const fee = income * feeRate;
                        usd += (income - fee); pos -= sellAmt; feeUsd += fee;
                        arbUsd += (income - fee - perUsd);
                        trades++; lActive[i] = true;
                    }
                } 
                else if (p > startPrice) {
                    if (sActive[i] && h >= p && prev < p) {
                        const val = perUsd;
                        const fee = val * feeRate;
                        usd += (val - fee); pos -= (val / p); feeUsd += fee; sActive[i] = false;
                    }
                    else if (!sActive[i] && l <= (p - d) && prev > (p - d)) {
                        const buyAmt = perUsd / p;
                        const cost = buyAmt * (p - d);
                        const fee = cost * feeRate;
                        usd -= (cost + fee); pos += buyAmt; feeUsd += fee;
                        arbUsd += (perUsd - cost - fee);
                        trades++; sActive[i] = true;
                    }
                }
            }
        };

        const isUp = c > prev;
        if(isUp) for(let i=0;i<gridCount;i++) exec(i); 
        else for(let i=gridCount-1;i>=0;i--) exec(i);
        
        history.push(usd + pos * c); 
        prev = c;
    });
    
    return { history, trades, feePct: (feeUsd/initCapital)*100, arbPct: (arbUsd/initCapital)*100, ret: ((history[history.length-1]/initCapital)-1)*100 };
}

function runBacktest() {
    const min=parseFloat(document.getElementById('gridLower').value), max=parseFloat(document.getElementById('gridUpper').value), count=parseInt(document.getElementById('grids').value);
    const fee=parseFloat(document.getElementById('fee').value)/100, capital=parseFloat(document.getElementById('capital').value), mode=document.getElementById('gridMode').value, start=parseFloat(globalKlines[0][4]);
    
    let prices = [], diffs = [];
    if (mode==="arithmetic") { 
        const step=(max-min)/(count-1); 
        for(let i=0;i<count;i++){ prices.push(min+i*step); diffs.push(step); } 
    } else { 
        const ratio=Math.pow(max/min,1/(count-1)); 
        for(let i=0;i<count;i++){ let p=min*Math.pow(ratio,i); prices.push(p); diffs.push(p*ratio-p); } 
    }
    
    const strategies = [
        { name: "LONG (Pos)", type: "long", mode: "position", color: "#f5222d" },
        { name: "LONG (NoPos)", type: "long", mode: "no_position", color: "#ff7875" },
        { name: "SHORT (Pos)", type: "short", mode: "position", color: "#389e0d" },
        // 【修改】SHORT (NoPos) 改为紫色，以便区分
        { name: "SHORT (NoPos)", type: "short", mode: "no_position", color: "#9254de" }, 
        { name: "NEUTRAL", type: "neutral", mode: "no_position", color: "#d48806" }, 
    ];

    const results = {};
    strategies.forEach(s => {
        results[s.name] = coreCalc(s.type, s.mode, prices, start, fee, capital, diffs);
    });

    const holdHistory = globalKlines.map(k => capital * (parseFloat(k[4]) / start));
    const holdRet = ((holdHistory[holdHistory.length-1]/capital)-1)*100;
    
    renderChart(results, holdHistory); 
    renderUI(results, holdRet);
}

function renderUI(results, holdRet) {
    const center = document.getElementById('audit-data-center');
    const getAlpha = (ret) => (ret-holdRet);
    
    let html = '';
    // 【修改】同步更新 UI 颜色映射
    const strategyColors = {
        "LONG (Pos)": "#f5222d", "LONG (NoPos)": "#ff7875",
        "SHORT (Pos)": "#389e0d", "SHORT (NoPos)": "#9254de",
        "NEUTRAL": "#d48806"
    };

    for (const [name, data] of Object.entries(results)) {
        const color = strategyColors[name];
        const alpha = getAlpha(data.ret);
        html += `
        <div class="log-row" style="border-left:2px solid ${color}">
            <div class="log-header"><span class="log-title">${name}</span><span class="final-ret ${data.ret>=0?'up':'down'}">${data.ret>=0?'+':''}${data.ret.toFixed(2)}%</span></div>
            <div class="stat-grid">
                <div class="stat-item"><span class="stat-label">成交</span><span class="stat-val">${data.trades}</span></div>
                <div class="stat-item"><span class="stat-label">网格套利</span><span class="stat-val up">+${data.arbPct.toFixed(2)}%</span></div>
                <div class="stat-item"><span class="stat-label">总手续费</span><span class="stat-val down">-${data.feePct.toFixed(2)}%</span></div>
            </div>
            <div class="alpha-highlight" style="border-color:${alpha>=0?'rgba(56,158,13,0.3)':'rgba(245,34,45,0.3)'}"><span style="font-size:8px;color:var(--text-dim)">ALPHA (对比持币)</span><span class="alpha-val ${alpha>=0?'up':'down'}">${alpha>=0?'+':''}${alpha.toFixed(2)}%</span></div>
        </div>`;
    }
    
    html += `<div class="log-row" style="border-left:2px solid var(--blue);opacity:0.8;"><div class="log-header"><span class="log-title">HOLD 基准持币</span><span class="final-ret ${holdRet>=0?'up':'down'}">${holdRet>=0?'+':''}${holdRet.toFixed(2)}%</span></div><div style="font-size:8px;color:var(--text-dim);text-align:center;">MARKET BENCHMARK</div></div>`;
    
    center.innerHTML = html;
}

function renderChart(results, hold) {
    if (chart) chart.destroy();
    const timeLabels = globalKlines.map(k => { 
        const d = new Date(k[0]), iv = document.getElementById('interval').value;
        if(iv==='1d'||iv==='3d') return `${d.getMonth()+1}/${d.getDate()}`;
        return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${d.getMinutes()<10?'0':''}${d.getMinutes()}`;
    });
    
    const datasets = [];
    // 【修改】同步更新图表颜色映射
    const colors = {
        "LONG (Pos)": "#f5222d", "LONG (NoPos)": "#ff7875",
        "SHORT (Pos)": "#389e0d", "SHORT (NoPos)": "#9254de",
        "NEUTRAL": "#d48806"
    };

    for (const [name, data] of Object.entries(results)) {
        datasets.push({
            label: name,
            data: data.history,
            borderColor: colors[name],
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.1,
            hidden: false 
        });
    }
    
    datasets.push({
        label: 'HOLD',
        data: hold,
        borderColor: '#00f2ff',
        borderDash: [4,4],
        borderWidth: 1.2,
        pointRadius: 0
    });

    chart = new Chart(document.getElementById('mainChart'), {
        type: 'line', data: { labels: timeLabels, datasets: datasets },
        options: {
            responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
            scales: { 
                x: { ticks: { color: '#8b949e', font: { size: 10 }, maxTicksLimit: 8 }, grid: { display: false } },
                y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#8b949e', font: { size: 10 } } }
            },
            plugins: { 
                legend: { display: true, position: 'top', align: 'end', labels: { color: '#c9d1d9', usePointStyle: true, boxWidth: 6, font: { size: 11 } } },
                tooltip: { backgroundColor: '#0c1018', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1 }
            }
        }
    });
}
</script>
</body>
</html>
